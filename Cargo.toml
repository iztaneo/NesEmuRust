[package]
name = "nes_emu_rust"
version = "0.1.0"
edition = "2021"
description = "NES (Nintendo Entertainment System) Emulator in Rust based on NESdev Wiki specifications"

[dependencies]
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
bitflags = "2.6"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
